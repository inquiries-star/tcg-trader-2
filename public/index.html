<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>TCG Trader</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root{--bg:#f8f6f0;--surf:#fff;--text:#17140d;--onacc:#14110a;--mute:#6c6657;--line:#e7e1d2;--acc:#f9db30;--acct:#6f5a00;--acc2:#f6ecc9;--ok:#12805c;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a08;--surf:#15130e;--text:#f4efe0;--onacc:#14110a;--mute:#a39b86;--line:#2c271b;--acc:#f9db30;--acct:#f9db30;--acc2:#2b2410;--ok:#3ecf9b;--bad:#ff7a6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0a08;--surf:#15130e;--text:#f4efe0;--onacc:#14110a;--mute:#a39b86;--line:#2c271b;--acc:#f9db30;--acct:#f9db30;--acc2:#2b2410;--ok:#3ecf9b;--bad:#ff7a6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surf);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px}.logo span{color:var(--acct)}
nav{display:flex;gap:6px;margin-left:auto}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surf);padding:8px 14px;border-radius:10px;cursor:pointer}
.btn.on,.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.btn.sm{padding:5px 10px;font-size:13px}.btn.bad{color:var(--bad)}
main{max-width:1100px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.bar input,.bar select,.f input,.f select,.f textarea{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surf);width:100%}
.bar input{flex:1 1 220px;width:auto}.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:hover{border-color:var(--acc)}
.ph{aspect-ratio:5/7;background:var(--acc2);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.tag.sold{left:auto;right:8px;background:var(--bad)}
.cb{padding:10px 12px}.cb h3{margin:0 0 3px;font-size:14.5px;line-height:1.3}
.price{font-weight:700;font-size:17px}.mute{color:var(--mute);font-size:13px}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:640px;margin:0 auto}
.f{display:grid;gap:12px}.f label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:64px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--surf);border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px}
@media(max-width:640px){.mbox{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
.mbox .main{width:100%;aspect-ratio:5/7;object-fit:contain;background:var(--acc2);border-radius:12px}
.empty{text-align:center;color:var(--mute);padding:48px 12px}
.msg{padding:10px 12px;border-radius:10px;background:var(--acc2);margin-bottom:12px;font-size:14px}
.li{display:flex;gap:12px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.li img,.li .z{width:48px;height:67px;object-fit:cover;border-radius:6px;background:var(--acc2);flex:none}
.li .g{flex:1;min-width:0}.li .a{display:flex;gap:6px;flex-wrap:wrap}
.mg{display:grid;grid-template-columns:260px 1fr;gap:14px;max-width:1000px;margin:0 auto}
@media(max-width:700px){.mg{grid-template-columns:1fr}}
.tl{display:grid;gap:8px;align-content:start}
.ti{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}
.ti.on{border-color:var(--acc)}.ti b{display:block;font-size:14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px}
.cv{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:360px}
.bx{display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:55vh;flex:1}
.bb{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--acc2);white-space:pre-wrap;word-break:break-word;align-self:flex-start}
.bb.me{background:var(--acc);color:var(--onacc);align-self:flex-end}
.of{border:1px dashed var(--acc);border-radius:12px;padding:10px;font-size:14px;align-self:stretch}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--acc2)}
.chip.accepted{background:var(--ok);color:#fff}.chip.declined,.chip.withdrawn{background:var(--bad);color:#fff}
.sn{display:flex;gap:8px}.sn textarea{flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--surf);resize:none}
.hero{border-radius:20px;padding:36px 20px 28px;background:linear-gradient(130deg,#0d0d0d,#f9db30);color:#fff;text-align:center;margin-bottom:24px}
.hero h1{font-size:clamp(26px,5vw,40px);margin:0 0 10px;letter-spacing:-.5px;line-height:1.15}.hero p{max-width:620px;margin:0 auto 22px;opacity:.93}
.fan{display:flex;justify-content:center;padding-left:28px}
.fan svg{width:96px;height:auto;margin-left:-28px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.fan svg:nth-child(1){transform:rotate(-12deg)}.fan svg:nth-child(2){transform:translateY(-10px)}.fan svg:nth-child(3){transform:rotate(12deg)}
.fan.big svg{width:140px}
.hh{color:#fff}.hhi{max-width:1100px;margin:0 auto;padding:20px 16px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hh h1{margin:4px 0;font-size:28px}.hh p{margin:0 0 8px;max-width:520px;opacity:.93}.st{font-size:14px}.st b{margin-left:12px}.st b:first-child{margin-left:0}.hh a{color:inherit}
a.hc{text-decoration:none;color:inherit}
.hca{aspect-ratio:5/6;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,var(--a),var(--b));padding:16px}.hca svg{height:100%;width:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.steps div{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px}.steps b{display:block;margin-bottom:4px}
.chip.completed,.chip.released{background:var(--ok);color:#fff}
.chip.cancelled,.chip.disputed,.chip.forfeited{background:var(--bad);color:#fff}
.chip.held{background:var(--acc);color:#fff}
.trk{display:grid;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.trk input,.trk select,.f select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surf)}

/* ---- visual refresh: live background, glass header, richer cards ---- */
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.logo,.price{font-family:"Space Grotesk",Inter,system-ui,sans-serif;text-wrap:balance}
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
main{position:relative;z-index:1}
header{background:color-mix(in srgb,var(--surf) 78%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;box-shadow:0 1px 2px rgba(10,20,30,.06)}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 28px -10px rgba(10,20,30,.35)}
.panel,.steps div,.li,.ti,.cv{box-shadow:0 1px 2px rgba(10,20,30,.05)}
.btn{transition:transform .12s ease,background .15s ease,border-color .15s ease}
.btn:hover{border-color:var(--acct)}.btn.pri:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hero{position:relative;overflow:hidden;background:linear-gradient(130deg,rgba(10,10,10,.96) 45%,rgba(249,219,48,.92) 140%);box-shadow:0 20px 40px -22px rgba(10,10,10,.6)}
.hero::after{content:"";position:absolute;inset:-40% -10% auto auto;width:60%;aspect-ratio:1;background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent);pointer-events:none}
.hh{box-shadow:0 10px 30px -18px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){.card,.btn{transition:none}.card:hover{transform:none}}
.hci{max-width:100%;max-height:100%;object-fit:contain;border-radius:9px;box-shadow:0 10px 22px rgba(0,0,0,.45)}

/* phone fit: nav wraps instead of widening the page */
nav{flex-wrap:wrap;min-width:0;max-width:100%}
@media(max-width:700px){header{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}nav{margin-left:0;width:100%}nav .btn{padding:7px 11px;font-size:14px}}
html,body{overflow-x:hidden}

/* hero carousel */
.car{position:relative;border-radius:20px;overflow:hidden;margin-bottom:24px;box-shadow:0 20px 40px -22px rgba(0,0,0,.6);touch-action:pan-y}
.car-track{display:flex;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.slide{flex:0 0 100%;min-width:0;display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:center;padding:34px 64px 58px;min-height:330px;color:#fff;position:relative;overflow:hidden}
.slide::after{content:"";position:absolute;inset:-40% -10% auto auto;width:55%;aspect-ratio:1;background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent);pointer-events:none}
.slide .eb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 8px}
.slide h1{font-size:clamp(26px,5vw,42px);margin:0 0 8px;line-height:1.1}
.slide p{margin:0 0 18px;max-width:440px;opacity:.95}
.slide .go{display:inline-block;background:#fff;color:#111;text-decoration:none;font-weight:600;padding:10px 18px;border-radius:10px}
.slide .go:hover{filter:brightness(.93)}
.slide .vis{display:flex;justify-content:center;align-items:center;min-width:0;position:relative;z-index:1}
.slide .vis .fan svg{width:110px}
.slide .vis .slimg{max-height:260px;max-width:100%;border-radius:10px;box-shadow:0 14px 28px rgba(0,0,0,.45);transform:rotate(4deg)}
.car-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;font-size:20px;line-height:1;cursor:pointer;z-index:2}
.car-arrow:hover{background:rgba(0,0,0,.6)}.car-arrow.l{left:12px}.car-arrow.r{right:12px}
.car-dots{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:8px;z-index:2}
.car-dots button{width:9px;height:9px;padding:0;border-radius:99px;border:0;background:rgba(255,255,255,.5);cursor:pointer;transition:width .2s,background .2s}
.car-dots button.on{width:26px;background:#fff}
.car-arrow:focus-visible,.car-dots button:focus-visible,.slide .go:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:700px){.slide{grid-template-columns:1fr;padding:26px 20px 56px;min-height:0;text-align:left}.slide .vis{order:-1}.slide .vis .fan svg{width:78px}.slide .vis .slimg{max-height:170px}.car-arrow{display:none}}
@media (prefers-reduced-motion:reduce){.car-track{transition:none}}

/* account, earnings, listing stats */
.at{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.tile b{display:block;font:700 24px "Space Grotesk",Inter,system-ui,sans-serif;margin-top:2px}
.tile .mute{font-size:12.5px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surf)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600}
.tbl tr:last-child td{border-bottom:0}.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.sw{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}.sw input{width:20px;height:20px;accent-color:var(--acc)}
.sw span{min-width:0}.sw small{display:block;color:var(--mute);font-size:12.5px}
.pm{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stats span{font-size:12px;background:var(--acc2);padding:2px 8px;border-radius:99px;white-space:nowrap}
.sect{max-width:860px;margin:0 auto}.sect h3{margin:18px 0 8px}
.todo{display:grid;gap:8px}.todo div{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 12px}

</style>
</head>
<body>
<canvas id="bgfx" aria-hidden="true"></canvas>
<header>
  <a href="#" class="logo" style="text-decoration:none;color:inherit" onclick="tab='browse';openT=null;render()">TCG <span>Trader</span> <span class="mute" style="font-weight:500">· buy, sell &amp; trade</span></a>
  <nav>
    <button class="btn on" data-t="browse" data-h>Marketplace</button>
    <button class="btn" data-t="board" data-h>Community</button>
    <button class="btn" data-t="wants" data-h>Want list</button>
    <button class="btn" data-t="sell" data-h>Sell</button>
    <button class="btn" data-t="mine" data-h>My listings</button>
    <button class="btn" data-t="msgs" id="mb">Messages</button>
    <button class="btn" data-t="acct" id="ab">Account</button>
  </nav>
  <div id="who"></div>
</header>
<div id="hhead"></div>
<main id="app"><div class="empty">Loading…</div></main>
<div id="modal"></div>
<script>
let hub=null,tab='browse',openT=null,aid=0,rt=0,rateCache={};
const HUBS=[
{s:'pokemon',g:'Pokémon',img:'img/pokemon-tile.jpg',ink:'#14110a',ac:['#f9db30','#14110a'],c:['#f9db30','#f9db30'],t:'Buy, Sell, Trade, Chat and more all rarities and Sealed Products'},
{s:'onepiece',g:'One Piece',c:['#e76f51','#1d3557'],t:'Leaders, alt arts and set completions for the crew.'},
{s:'magic',g:'Magic: The Gathering',c:['#7b3fa0','#23233f'],t:'Singles, staples and sealed finds for every format.'},
{s:'yugioh',g:'Yu-Gi-Oh!',c:['#b8860b','#3d2c8d'],t:'Duelists swapping rares, staples and collector pieces.'},
{s:'riftbound',g:'Riftbound',c:['#0f6e8c','#0a1f44'],t:'Champions, runes and battlefield-ready decks from the League of Legends TCG.'},
{s:'lorcana',g:'Disney Lorcana',c:['#2a9d8f','#264653'],t:'Inkable cards, enchanted rarities and set chases.'},
{s:'gundam',g:'Gundam',c:['#d62828','#1d3557'],t:'Units, pilots and bases from the Gundam Card Game.'},
{s:'other',g:'Other TCG',c:['#5c677d','#2b2d42'],t:'Every other trading card game finds a home here.'}];
const hubFromHash=()=>{const h=HUBS.find(x=>x.s===location.hash.slice(1));return h?h.g:null};
window.addEventListener('hashchange',()=>{hub=hubFromHash();tab='browse';openT=null;scrollTo(0,0);render()});
function syncNav(){document.querySelectorAll('nav button').forEach(b=>{if(b.hasAttribute('data-h'))b.hidden=!hub;b.classList.toggle('on',b.dataset.t===tab)})}
function shape(k){return [`<circle cx="50" cy="59" r="18" fill="rgba(255,255,255,.55)"/><circle cx="50" cy="59" r="9" fill="rgba(255,255,255,.9)"/>`,`<polygon points="50,40 55,54 70,54 58,63 62,78 50,69 38,78 42,63 30,54 45,54" fill="rgba(255,255,255,.8)"/>`,`<polygon points="50,38 72,59 50,80 28,59" fill="rgba(255,255,255,.75)"/><polygon points="50,48 62,59 50,70 38,59" fill="rgba(255,255,255,.4)"/>`][k%3]}
function art(h,k){const id='ga'+(++aid);return `<svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${(h.ac||h.c)[0]}"/><stop offset="1" stop-color="${(h.ac||h.c)[1]}"/></linearGradient></defs><rect x="2" y="2" width="96" height="136" rx="8" fill="#fff" stroke="rgba(0,0,0,.25)"/><rect x="7" y="7" width="86" height="126" rx="5" fill="url(#${id})"/><rect x="12" y="12" width="76" height="12" rx="3" fill="rgba(255,255,255,.85)"/><rect x="12" y="28" width="76" height="62" rx="4" fill="rgba(255,255,255,.18)" stroke="rgba(255,255,255,.7)"/>${shape(k)}<rect x="12" y="96" width="76" height="30" rx="3" fill="rgba(255,255,255,.85)"/><rect x="16" y="101" width="50" height="3" rx="1.5" fill="rgba(0,0,0,.35)"/><rect x="16" y="108" width="60" height="3" rx="1.5" fill="rgba(0,0,0,.2)"/><rect x="16" y="115" width="40" height="3" rx="1.5" fill="rgba(0,0,0,.2)"/></svg>`}
function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const sc=Math.min(1,1100/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej(new Error('bad image')),'image/jpeg',.85);URL.revokeObjectURL(url);
    };
    img.onerror=()=>rej(new Error('bad image'));img.src=url;
  });
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
// ---- TCG Trader frontend (talks to /api/*) ----
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toFixed(2);
const photo=id=>'/api/photo/'+id;

async function api(path,o={}){
  const h={'x-requested-with':'tt'};let body;
  if(o.raw){h['content-type']=o.raw.type||'image/jpeg';body=o.raw}
  else if(o.body){h['content-type']='application/json';body=JSON.stringify(o.body)}
  const r=await fetch('/api'+path,{method:o.method||'GET',headers:h,body,credentials:'same-origin'});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok){const e=new Error(d.error||'Something went wrong');e.status=r.status;throw e}
  return d;
}

let heroI=0,heroT=0;
function heroHtml(){

}
function initHero(app){
  clearInterval(heroT);
  const car=app.querySelector('.car');if(!car)return;
  const tr=car.querySelector('.car-track'),dots=[...car.querySelectorAll('.car-dots button')],n=dots.length;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let hold=false;
  const go=i=>{heroI=(i+n)%n;tr.style.transform=`translateX(-${heroI*100}%)`;dots.forEach((d,k)=>{d.classList.toggle('on',k===heroI);d.setAttribute('aria-current',k===heroI?'true':'false')})};
  car.querySelector('.car-arrow.l').onclick=()=>go(heroI-1);
  car.querySelector('.car-arrow.r').onclick=()=>go(heroI+1);
  dots.forEach((d,k)=>d.onclick=()=>go(k));
  car.addEventListener('mouseenter',()=>hold=true);car.addEventListener('mouseleave',()=>hold=false);
  car.addEventListener('focusin',()=>hold=true);car.addEventListener('focusout',()=>hold=false);
  let sx=null;
  car.addEventListener('pointerdown',e=>{sx=e.clientX;hold=true});
  car.addEventListener('pointerup',e=>{if(sx!==null&&Math.abs(e.clientX-sx)>40)go(heroI+(e.clientX<sx?1:-1));sx=null;setTimeout(()=>hold=false,3000)});
  const prev=tr.style.transition;tr.style.transition='none';go(heroI);requestAnimationFrame(()=>{tr.style.transition=prev});
  if(!reduce)heroT=setInterval(()=>{if(!document.body.contains(car)){clearInterval(heroT);return}if(!hold&&!document.hidden)go(heroI+1)},5000);
}

async function vBrowse(app,t){
  loading(app);
  const {items}=await api('/listings?game='+encodeURIComponent(hub));if(t!==rt)return;
  app.innerHTML=`<div class="bar"><input id="q" placeholder="Search cards, sealed products, sets or sellers" value="${esc(F.q)}">
  <select id="k"><option value="All">Cards and sealed</option><option value="card" ${F.prod==='card'?'selected':''}>Single cards</option><option value="sealed" ${F.prod==='sealed'?'selected':''}>Sealed products</option></select>
  <select id="g"><option value="All">All listings</option><option value="sale" ${F.kind==='sale'?'selected':''}>Buy now</option><option value="trade" ${F.kind==='trade'?'selected':''}>Open to trades</option></select>
  <select id="s"><option value="new">Newest</option><option value="low" ${F.sort==='low'?'selected':''}>Price: low to high</option><option value="high" ${F.sort==='high'?'selected':''}>Price: high to low</option></select></div><div id="gr"></div>`;
  const draw=()=>{
    let v=items.slice();const q=F.q.trim().toLowerCase();
    if(q)v=v.filter(i=>[i.title,i.set,i.seller.name,i.productType].join(' ').toLowerCase().includes(q));
    if(F.kind==='trade')v=v.filter(i=>i.type!=='sale');
    if(F.kind==='sale')v=v.filter(i=>i.type!=='trade');
    if(F.prod==='card')v=v.filter(i=>!isSealed(i));
    if(F.prod==='sealed')v=v.filter(isSealed);
    v.sort((a,b)=>F.sort==='low'?a.price-b.price:F.sort==='high'?b.price-a.price:new Date(b.created)-new Date(a.created));
    $('#gr').innerHTML=v.length?`<div class="grid">${v.map(cardHtml).join('')}</div>`:'<div class="empty">Nothing listed here yet. Be the first: tap “Sell” to list a card or sealed product.</div>';
    $('#gr').querySelectorAll('.card').forEach(c=>c.onclick=()=>openItem(items.find(i=>i.id===c.dataset.id)));
  };
  $('#q').oninput=e=>{F.q=e.target.value;draw()};
  $('#k').onchange=e=>{F.prod=e.target.value;draw()};
  $('#g').onchange=e=>{F.kind=e.target.value;draw()};
  $('#s').onchange=e=>{F.sort=e.target.value;draw()};
  draw();
}

async function upload(file){const r=await api('/photos',{method:'POST',raw:await compress(file)});return r.id}
async function composer(i,kind){
  let own=[];
  if(kind==='trade'){try{own=(await api('/listings?mine=1&game='+encodeURIComponent(i.game))).items.filter(x=>!x.sold)}catch{}}
  $('#comp').innerHTML=`<div class="f" style="margin:10px 0">
  ${kind==='trade'?`<label>Card or sealed product you’re offering<input id="co" maxlength="120" placeholder="e.g. Blastoise ex, Near Mint, or a sealed booster box"></label>
  ${own.length?`<label>…or pick one of your listings<select id="cs"><option value="">None</option>${own.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</select></label>`:''}
  <label>Shipping cost for your card ($)<input id="cship" type="number" min="0" step="0.01" placeholder="0.00"></label>
  <label>Estimated value of your card ($)<input id="cval" type="number" min="1" step="0.01" placeholder="Sets the trade deposit"></label>
  <div class="row2"><label>Front photo of your card<input id="cpf" type="file" accept="image/*"></label><label>Back photo<input id="cpb" type="file" accept="image/*"></label></div>
  <div class="mute">Photos are required unless you pick one of your listings (its photos are used).</div>`:''}
  <label>${kind==='trade'?'Note (optional)':'Message'}<textarea id="ct" rows="3" maxlength="500"></textarea></label>
  <div class="mute" id="cmsg"></div><button class="btn pri" id="csend">${kind==='trade'?'Send trade offer':'Send message'}</button></div>`;
  const cs=$('#cs');if(cs)cs.onchange=e=>{const x=own.find(y=>y.id===e.target.value);if(x){$('#cship').value=x.shipping;$('#cval').value=x.value||'';if(!$('#co').value)$('#co').value=x.title}};
  $('#csend').onclick=async()=>{
    const g=id=>($('#'+id)||{}).value||'';const cm=t=>{$('#cmsg').textContent=t};
    const payload={listingId:i.id,text:g('ct').trim()};
    if(kind==='trade'){
      const card=g('co').trim(),ship=parseFloat(g('cship')||'0'),sel=g('cs'),pf=$('#cpf').files[0],pb=$('#cpb').files[0];
      if(!card)return cm('Say which card you’re offering.');
      if(!sel&&!(pf&&pb))return cm('Add front and back photos of your card, or pick one of your listings.');
      if(!sel&&!(parseFloat(g('cval'))>0))return cm('Enter the estimated value of your card.');
      payload.offer={card,ship:Number.isFinite(ship)?ship:0,value:parseFloat(g('cval'))||undefined};
    }else if(!payload.text)return cm('Type a message.');
    $('#csend').disabled=true;

      const A=o.myAddress||{};
      const af=(k,l,w)=>`<input data-ad="${k}" data-m="${m.id}" placeholder="${l}" maxlength="80" value="${esc(A[k]||(k==='country'?'CA':''))}" style="${w||''}">`;
      const manual=`<div class="mute" style="margin-top:6px">Or enter a tracking number from a label you bought elsewhere (not carrier-verified):</div><input data-trk="${m.id}" maxlength="40" placeholder="Tracking number"> <button class="btn sm" data-act="ship" data-m="${m.id}">Mark shipped</button>`;
      let mineHtml;
      if(myT)mineHtml=`<span class="chip accepted">You shipped</span> <span class="mute">${esc(myT)}</span>${(isSeller?o.sellerVerified:o.buyerVerified)?` <span class="chip accepted">carrier-verified (${esc((isSeller?o.sellerCarrier:o.buyerCarrier)||'')})</span>`:''}${o.myLabel?` <a href="${esc(o.myLabel)}" target="_blank" rel="noopener">Open label</a>`:''}`;
      else if(myDep!=='held')mineHtml=`<button class="btn sm pri" data-act="deposit" data-m="${m.id}">Pay ${money(o.deposit)} deposit (demo)</button> <span class="mute">before shipping</span>`;
      else{
        const rs=rateCache[m.id];
        const step=!o.hasMyAddress?`<div class="mute">Add your shipping address so a label can be printed (US or Canada). It is only used for labels and is deleted when the trade ends. The other trader never sees it.</div>
          <div class="row2">${af('name','Full name')}${af('phone','Phone (optional)')}</div>${af('street1','Street address')}${af('street2','Apt, suite (optional)')}
          <div class="row2">${af('city','City')}${af('state','State / province')}</div><div class="row2">${af('zip','ZIP / postal code')}${af('country','Country (US or CA)')}</div>
          <button class="btn sm pri" data-act="address" data-m="${m.id}">Save address</button>`
        :!o.hasTheirAddress?`<span class="mute">Address saved. Waiting for ${esc(them)} to add theirs.</span>`
        :rs?`<div class="mute">Choose a courier service:</div>${rs.map((r,i)=>`<label style="display:block"><input type="radio" name="rate-${m.id}" value="${esc(r.id)}" ${i===0?'checked':''}> ${esc(r.carrier)} ${esc(r.service)} · ${money(r.amount)}${r.days?` · ~${r.days} days`:''}</label>`).join('')}<button class="btn sm pri" data-act="label" data-m="${m.id}">Buy label (you pay the courier)</button>`
        :`<button class="btn sm pri" data-act="rates" data-m="${m.id}">Get courier rates</button>`;
        mineHtml=`${step}${manual}`;
      }
      const thV=isSeller?o.buyerVerified:o.sellerVerified,thS=isSeller?o.buyerTrack:o.sellerTrack;
      const theirHtml=thT?`<span class="chip accepted">${esc(them)} shipped</span> <span class="mute">${esc(thT)}</span>${thV?` <span class="chip accepted">carrier-verified</span>${thS?` <span class="mute">status: ${esc(thS.toLowerCase().replace(/_/g,' '))}</span>`:''}`:' <span class="mute">(tracking not verified)</span>'}`:`<span class="mute">Waiting for ${esc(them)} to ship</span>`;
      const rc=myR?'<span class="chip accepted">You confirmed receipt</span>':(thT?`<button class="btn sm pri" data-act="recv" data-m="${m.id}">I received my card</button>`:'');
      const rated=o.ratings.find(r=>r.rater===mine);
      const end=st==='completed'?(rated?`<div class="mute">You rated this trade ★ ${rated.stars}. Deposits were returned.</div>`:`<div class="mute">Both deliveries confirmed. Deposits returned.</div><div>Rate ${esc(them)}: <select data-rs="${m.id}">${[5,4,3,2,1].map(n=>`<option value="${n}">${'★'.repeat(n)}</option>`).join('')}</select> <button class="btn sm" data-act="rate" data-m="${m.id}">Submit rating</button></div>`)
        :`<div class="mute">Ship by ${o.shipBy?day(o.shipBy):'the deadline'} or the trade is cancelled. If only one trader ships, the other forfeits their deposit to them. A missing receipt confirmation is assumed after 72 hours.</div><div><button class="btn sm bad" data-act="dispute" data-m="${m.id}">Report a problem</button></div>`;
      body+=`<div class="f" style="gap:6px"><div>Your shipment:</div>${mineHtml}</div><div>Their shipment: ${theirHtml}</div>${rc?`<div>${rc}</div>`:''}${end}`;
    }else if(st==='cancelled'){
      body+=o.buyerDeposit==='forfeited'?`<div><b>Cancelled.</b> ${esc(bN)} missed the ship-by date and forfeited their deposit to ${esc(sN)}.</div>`
        :o.sellerDeposit==='forfeited'?`<div><b>Cancelled.</b> ${esc(sN)} missed the ship-by date and forfeited their deposit to ${esc(bN)}.</div>`
        :'<div><b>Cancelled.</b> Nobody shipped by the deadline. Any deposits were returned.</div>';
    }else if(st==='disputed')body+='<div><b>Disputed.</b> Deposits stay held until it is resolved. (Moderator resolution isn’t built in this demo.)</div>';
    box=`<div class="trk"><b>Trade deposit and tracker</b>${body}</div>`;
  }
  return `<div class="of"><b>Trade offer</b> <span class="chip ${st}">${st}</span><br>${esc(m.from===mine?'You':bN)} offered <b>${esc(o.card)}</b> for <b>${esc(o.theirTitle)}</b>.<br>
  <div class="thumbs" style="margin:6px 0">${o.photos.map(u=>`<img src="${photo(u)}" alt="">`).join('')}</div>
  <span class="mute">Shipping: each trader pays their own. ${esc(bN)} pays ${money(o.buyerShip)}, ${esc(sN)} pays ${money(o.sellerShip)}. No balancing payment.</span>
  ${m.text?`<div style="margin-top:6px">${esc(m.text)}</div>`:''}<div style="margin-top:8px">${btns}</div>${box}</div>`;
}
async function loadMsgs(){
  const d=await api('/threads'+(hub?'?game='+encodeURIComponent(hub):''));
  tl=d.threads;
  if(!tl.some(x=>x.id===openT))openT=tl[0]?tl[0].id:null;
  cur=openT?await api('/threads/'+openT):null;
  const n=d.threads.filter(x=>x.unread&&x.id!==openT).length;
  $('#mb').textContent=n?`Messages (${n})`:'Messages';
  return JSON.stringify([tl.map(x=>[x.id,x.last,x.lastAt]),cur&&cur.messages.map(m=>[m.id,m.offer&&[m.offer.status,m.offer.buyerTracking,m.offer.sellerTracking,m.offer.buyerReceived,m.offer.sellerReceived,m.offer.buyerDeposit,m.offer.sellerDeposit,m.offer.hasMyAddress,m.offer.hasTheirAddress,m.offer.buyerVerified,m.offer.sellerVerified,m.offer.buyerTrack,m.offer.sellerTrack,m.offer.ratings.length]])]);
}
function drawMsgs(){
  const app=$('#app'),focus=document.activeElement&&document.activeElement.id==='rt';
  const list=tl.map(x=>`<div class="ti ${x.id===openT?'on':''}" data-k="${x.id}"><b>${x.unread&&x.id!==openT?'<span class="dot"></span>':''}${esc(x.title)}</b><span class="mute">${esc(x.other.name)}${hub?'':' · '+esc(x.game)} · ${esc(x.last)}</span></div>`).join('');
  let conv='<div class="empty">Open a listing and tap “Message seller” or “Propose trade” to start a conversation.</div>';
  if(cur){const th=cur.thread,other=cur.me===th.buyer.id?th.seller:th.buyer;
    conv=`<div class="cv"><div><b>${esc(th.title)}</b> <span class="mute">· with ${esc(other.name)} ${ratingText(other)}</span></div>
    <div class="bx" id="bx">${cur.messages.map(m=>m.kind==='offer'?offerHtml(m):`<div class="bb ${m.from===cur.me?'me':''}">${esc(m.text)}</div>`).join('')}</div>
    <div class="sn"><textarea id="rt" rows="2" maxlength="500" placeholder="Write a message…">${esc(mtext)}</textarea><button class="btn pri" id="rs">Send</button></div></div>`}
  app.innerHTML=`<div style="max-width:1000px;margin:0 auto"><div class="msg">Only you and the other trader can read this conversation. Never share your full address in a message; agree on shipping details after the trade is accepted.</div></div><div class="mg"><div class="tl">${list||'<div class="mute">No conversations yet.</div>'}</div>${conv}</div>`;
  app.querySelectorAll('.ti').forEach(e=>e.onclick=async()=>{openT=e.dataset.k;mtext='';try{sig=await loadMsgs();drawMsgs()}catch(x){alert(x.message)}});
  const rt_=$('#rt');
  if(rt_){
    rt_.oninput=()=>{mtext=rt_.value};
    if(focus){rt_.focus();rt_.setSelectionRange(rt_.value.length,rt_.value.length)}
    $('#rs').onclick=async()=>{const text=rt_.value.trim();if(!text)return;$('#rs').disabled=true;
      try{await api('/threads/'+openT+'/messages',{method:'POST',body:{text}});mtext='';sig=await loadMsgs();drawMsgs()}catch(e){alert(e.message);$('#rs').disabled=false}};
  }
  app.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{
    const body={action:b.dataset.act};
    if(body.action==='ship'){body.trk=app.querySelector(`[data-trk="${b.dataset.m}"]`).value}
    if(body.action==='rate'){body.stars=+app.querySelector(`[data-rs="${b.dataset.m}"]`).value}
    if(body.action==='dispute'&&!confirm('Report a problem with this trade? Deposits stay held until it is resolved.'))return;
    if(body.action==='address'){body.address={};app.querySelectorAll(`[data-ad][data-m="${b.dataset.m}"]`).forEach(i=>{body.address[i.dataset.ad]=i.value})}
    if(body.action==='label'){const r=app.querySelector(`input[name="rate-${b.dataset.m}"]:checked`);if(!r)return;body.rateId=r.value}
    b.disabled=true;
    try{
      const res=await api('/threads/'+openT+'/offers/'+b.dataset.m,{method:'POST',body});
      if(res&&res.rates)rateCache[b.dataset.m]=res.rates;
      if(body.action==='label'||body.action==='address')delete rateCache[b.dataset.m];
      sig=await loadMsgs();drawMsgs();
    }catch(e){alert(e.message);b.disabled=false}
  });
  const bx=$('#bx');if(bx)bx.scrollTop=bx.scrollHeight;
}
async function vMsgs(app,t){
  if(!need())return signInPrompt(app);
  loading(app);
  const s=await loadMsgs();if(t!==rt)return;
  sig=s;drawMsgs();
}
async function poll(){
  if(!me||document.hidden)return;
  try{
    if(tab==='msgs'){
      const a=document.activeElement;
      if(a&&a.tagName==='INPUT')return;
      const s=await loadMsgs();if(tab==='msgs'&&s!==sig){sig=s;drawMsgs()}
    }else{
      const d=await api('/threads');const n=d.threads.filter(x=>x.unread).length;$('#mb').textContent=n?`Messages (${n})`:'Messages';
    }
  }catch{}
}

// ---------- community board ----------
async function vBoard(app,t){
  loading(app);
  const {posts}=await api('/board?game='+encodeURIComponent(hub));if(t!==rt)return;
  const day=d=>new Date(d).toLocaleDateString();
  app.innerHTML=`<div style="max-width:720px;margin:0 auto"><div class="panel" style="margin-bottom:14px"><div class="f"><b>Start a discussion in the ${esc(hub)} community</b>
  <input id="bt" maxlength="90" placeholder="Title, e.g. Looking for a mint copy of…"><textarea id="bx2" rows="3" maxlength="600" placeholder="What’s on your mind?"></textarea>
  <div class="mute" id="bm"></div><button class="btn pri" id="bp">Post</button></div></div>
  ${posts.length?posts.map(p=>`<div class="panel" style="margin-bottom:12px"><b>${esc(p.title)}</b> <span class="mute">· ${esc(p.author.name)} · ${day(p.at)}</span>${me&&p.author.id===me.id?` <button class="btn sm bad" data-dp="${p.id}">Delete</button>`:''}
  <p style="white-space:pre-wrap;margin:8px 0">${esc(p.text)}</p>
  ${p.replies.map(r=>`<div class="mute" style="border-left:3px solid var(--line);padding-left:10px;margin:6px 0"><b>${esc(r.author.name)}</b>: ${esc(r.text)}</div>`).join('')}
  <div class="sn" style="margin-top:8px"><input data-r="${p.id}" maxlength="300" placeholder="Reply…" style="flex:1;${FIELD}"><button class="btn sm" data-rb="${p.id}">Reply</button></div></div>`).join(''):'<div class="empty">No posts yet. Start the first conversation.</div>'}</div>`;
  $('#bp').onclick=async()=>{
    if(!need())return;
    const title=$('#bt').value.trim(),text=$('#bx2').value.trim();
    if(!title||!text)return $('#bm').textContent='Add a title and some text.';
    $('#bp').disabled=true;
    try{await api('/board',{method:'POST',body:{game:hub,title,text}});render()}catch(e){$('#bm').textContent=e.message;$('#bp').disabled=false}
  };
  app.querySelectorAll('[data-dp]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this post?'))return;try{await api('/board/'+b.dataset.dp,{method:'DELETE',body:{}});render()}catch(e){alert(e.message)}});
  app.querySelectorAll('[data-rb]').forEach(b=>b.onclick=async()=>{
    if(!need())return;
    const text=app.querySelector(`[data-r="${b.dataset.rb}"]`).value.trim();if(!text)return;
    b.disabled=true;try{await api('/board/'+b.dataset.rb+'/replies',{method:'POST',body:{text}});render()}catch(e){alert(e.message);b.disabled=false}
  });
}

// ---------- want list ----------
async function vWants(app,t){
  if(!need())return signInPrompt(app);
  loading(app);
  const d=await api('/wants?game='+encodeURIComponent(hub));if(t!==rt)return;
  app.innerHTML=`<div style="max-width:720px;margin:0 auto"><div class="panel" style="margin-bottom:14px"><div class="f"><b>Your ${esc(hub)} want list</b>
  <div class="mute">Add cards you’re hunting for. We flag matching listings, and tell you when someone wants a card you’ve listed.</div>
  <div class="sn"><input id="wi" maxlength="80" placeholder="Card name, e.g. Umbreon VMAX" style="flex:1;${FIELD}"><button class="btn pri" id="wa">Add</button></div><div class="mute" id="wm"></div>
  ${d.list.map(w=>`<div class="li" style="margin:0"><div class="g"><b>${esc(w.card)}</b></div><button class="btn sm bad" data-wd="${w.id}">Remove</button></div>`).join('')||'<div class="mute">No cards on your list yet.</div>'}</div></div>
  <h3>Matches for you</h3>${d.matches.length?d.matches.map(x=>`<div class="li" data-id="${x.id}" style="cursor:pointer"><img src="${photo(x.photos[0])}" alt=""><div class="g"><b>${esc(x.title)}</b><div class="mute">You want “${esc(x.want)}” · ${esc(x.seller.name)} · ${priceOf(x)}${x.type!=='sale'?' · open to trades':''}</div></div></div>`).join(''):'<div class="mute">No listings match your want list yet. They will show up here as they appear.</div>'}
  <h3 style="margin-top:18px">People who want your cards</h3>${d.interest.length?d.interest.map(x=>`<div class="li"><div class="g"><b>${esc(x.wanter)}</b> wants “${esc(x.card)}”<div class="mute">Matches your listing: ${esc(x.title)}</div></div></div>`).join(''):'<div class="mute">Nobody is hunting for your listed cards yet.</div>'}</div>`;
  $('#wa').onclick=async()=>{const card=$('#wi').value.trim();if(!card)return;$('#wa').disabled=true;try{await api('/wants',{method:'POST',body:{game:hub,card}});render()}catch(e){$('#wm').textContent=e.message;$('#wa').disabled=false}};
  app.querySelectorAll('[data-wd]').forEach(b=>b.onclick=async()=>{try{await api('/wants/'+b.dataset.wd,{method:'DELETE',body:{}});render()}catch(e){alert(e.message)}});
  app.querySelectorAll('.li[data-id]').forEach(e=>e.onclick=()=>openItem(d.matches.find(x=>x.id===e.dataset.id)));
}

(async function init(){
  hub=hubFromHash();
  await Promise.all([loadMe(),loadStats()]);
  render();
  setInterval(poll,15000);
})();


/* ---- live background: drifting colour fields and floating card shapes, tinted by the current community ---- */
(function(){
  const cv=document.getElementById('bgfx');if(!cv)return;
  const cx=cv.getContext('2d');if(!cx)return;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)');
  const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  let cur=[hex('#f9db30'),hex('#0d0d0d')],W=0,H=0,dpr=1,mx=.5,my=.5,t0=performance.now();
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const cards=Array.from({length:16},()=>({x:Math.random(),y:Math.random(),s:rnd(46,120),r:rnd(-.6,.6),vr:rnd(-.05,.05),v:rnd(.008,.022),d:rnd(.3,1),k:Math.random()}));
  const blobs=[0,1,2].map(i=>({ph:i*2.1,sp:rnd(.05,.09),rad:rnd(.38,.55)}));
  function size(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
  const dark=()=>{const r=document.documentElement,t=r.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches};
  function target(){const h=(typeof HUBS!=='undefined'&&typeof hub!=='undefined')?HUBS.find(x=>x.g===hub):null;return h?[hex(h.c[0]),hex(h.c[1])]:[hex('#f9db30'),hex('#0d0d0d')]}
  const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
  const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
  function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
  function frame(now){
    const t=(now-t0)/1000,tg=target(),dk=dark();
    cur=[mix(cur[0],tg[0],.04),mix(cur[1],tg[1],.04)];
    cx.clearRect(0,0,W,H);
    const ba=dk?.30:.20;
    blobs.forEach((b,i)=>{
      const c=cur[i%2],x=W*(.5+.38*Math.sin(t*b.sp+b.ph)+(mx-.5)*.06),y=H*(.45+.34*Math.cos(t*b.sp*1.3+b.ph)+(my-.5)*.06),r=Math.max(W,H)*b.rad;
      const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(c,ba));g.addColorStop(1,rgba(c,0));
      cx.fillStyle=g;cx.fillRect(0,0,W,H);
    });
    cards.forEach(c=>{
      const y=((c.y-t*c.v)%1.2+1.2)%1.2,x=c.x+Math.sin(t*.15+c.k*6)*.02+(mx-.5)*.03*c.d;
      const w=c.s*c.d,h=w*1.4,px=x*W,py=y*H-.1*H,rot=c.r+Math.sin(t*.2+c.k*9)*.15+c.vr*t*.3;
      cx.save();cx.translate(px,py);cx.rotate(rot);
      const col=cur[c.k>.5?0:1];
      cx.fillStyle=rgba(col,dk?.10:.07);cx.strokeStyle=rgba(col,dk?.35:.22);cx.lineWidth=1.2;
      rr(-w/2,-h/2,w,h,w*.09);cx.fill();cx.stroke();
      rr(-w*.38,-h*.38,w*.76,h*.5,w*.05);cx.strokeStyle=rgba(col,dk?.22:.14);cx.stroke();
      cx.restore();
    });
  }
  let raf=0;
  function loop(n){frame(n);raf=requestAnimationFrame(loop)}
  function start(){cancelAnimationFrame(raf);size();if(reduce.matches){cur=target();frame(performance.now())}else raf=requestAnimationFrame(loop)}
  addEventListener('resize',()=>{size();if(reduce.matches)frame(performance.now())});
  addEventListener('pointermove',e=>{mx=e.clientX/Math.max(1,W);my=e.clientY/Math.max(1,H)},{passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else start()});
  reduce.addEventListener&&reduce.addEventListener('change',start);
  addEventListener('hashchange',()=>{if(reduce.matches){cur=target();frame(performance.now())}});
  start();
})();
</script>
